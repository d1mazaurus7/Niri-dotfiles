"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false 

[character]
success_symbol = "[→](bold green)"
error_symbol = "[→](bold red)"

format = "$username$hostname$directory$character"

[username]
style_user = "bold green"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bold blue) "
style = "bold blue"
