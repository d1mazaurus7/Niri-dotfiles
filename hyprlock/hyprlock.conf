general {
    hide_cursor = true
    ignore_empty_input = true
}


background {
    monitor =
    path = ~/.cache/current_wallpaper_link
    blur_passes = 3
    blur_size = 5
}
input-field {
    monitor =
    size = 10%, 4%
    position = 0, -250
    outline_thickness = 3
    dots_size = 0.2
    outer_color = rgba(0, 0, 0, 0.25)
    inner_color = rgba(0, 0, 0, 0.25)
    check_color    = rgba(80, 80, 80, 0.6)
    font_color = rgba(255, 255, 255, 0.95)
    placeholder_text = <i>Input Password...</i>
    fail_color     = rgba(180, 40, 40, 0.7)
    capslock_color = rgba(200, 180, 80, 0.7)
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/greet.sh
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrains Mono Bold
    font_weight = bold
    position = 0, 80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/nowplaying.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 15
    font_family = JetBrains Mono Bold
    position = 0, -600
    halign = center
    valign = center
}

label {
    monitor = 
    text = $TIME
    font_size = 100
    font_family = JetBrains Mono Bold
    position = 0, 200

}

label {
    monitor = 
    text = $LAYOUT
    font_size = 15
    font_family = JetBrains Mono Bold
    position = 1200, -700
}
