[opener]
play = [
  { run = 'mpv "$@"', orphan = true, for = "unix" },
]
view = [
  { run = 'imv "$@"', orphan = true, for = "unix" },
]

[open]
rules = [
  { mime = "video/*", use = [ "play" ] },
  { mime = "audio/*", use = [ "play" ] },

  { mime = "image/*", use = [ "view" ] },

  { url = "*.mp4",  use = [ "play" ] },
  { url = "*.mkv",  use = [ "play" ] },
  { url = "*.webm", use = [ "play" ] },
  { url = "*.avi",  use = [ "play" ] },
  { url = "*.mov",  use = [ "play" ] },

  { url = "*.jpg",  use = [ "view" ] },
  { url = "*.jpeg", use = [ "view" ] },
  { url = "*.png",  use = [ "view" ] },
  { url = "*.webp", use = [ "view" ] },
  { url = "*.bmp",  use = [ "view" ] },
  { url = "*.svg",  use = [ "view" ] },

  { mime = "image/gif", use = [ "play" ] },

]
